# TURN relay for meeting guests outside the office (coturn). Browsers get short-lived credentials
# from LiveKit on the device (TURN REST, shared secret); the relay only ever sees encrypted media.
# The secret, the public/private IP mapping and the listening addresses are appended at start
# from .env (see docker-compose.yml).
listening-port=3478
fingerprint
use-auth-secret
realm=vipcon
no-tls
no-dtls
no-cli
no-software-attribute
no-multicast-peers
no-rfc5780
no-stun-backward-compatibility
response-origin-only-with-rfc5780
# Relay ports: open UDP min-port..max-port in the server's firewall (with 3478 UDP and TCP).
min-port=49160
max-port=49359
# Limits: allocations in total and per credential, and bytes per second per session (~5 Mbit/s).
total-quota=200
user-quota=12
max-bps=625000
stale-nonce=600
# Relay only to the public internet (the devices' public addresses), never into private networks,
# this server's own network or Tailscale.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
log-file=stdout
simple-log
