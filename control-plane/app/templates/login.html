{% extends "base.html" %}
{% block title %}Masuk · Vipcon Control{% endblock %}
{% block main_class %}center{% endblock %}
{% block content %}
<form method="post" action="/login" class="card narrow">
  <h1>Vipcon <span class="muted">Control</span></h1>
  <p class="muted">Khusus superadmin. Semua aksi tercatat.</p>
  <label>Email <input type="email" name="email" value="{{ email or '' }}" autocomplete="username" required autofocus></label>
  <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
  <label>Kode 2FA <input name="totp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]{6,7}" required></label>
  <button class="primary">Masuk</button>
</form>
{% endblock %}
