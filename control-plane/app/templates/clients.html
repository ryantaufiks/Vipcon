{% extends "base.html" %}
{% block content %}
<div class="head"><h1>Client</h1><a class="button primary" href="/clients/new">+ Client baru</a></div>
<table><thead><tr><th>Nama</th><th>Email</th><th>Telepon</th><th>Device</th><th>Sejak</th></tr></thead><tbody>
{% for c in clients %}<tr><td><a href="/clients/{{ c.id }}">{{ c.name }}</a></td><td>{{ c.contact_email or '—' }}</td><td>{{ c.contact_phone or '—' }}</td><td>{{ counts.get(c.id, 0) }}</td><td>{{ c.created_at|dt(False) }}</td></tr>
{% else %}<tr><td colspan="5" class="empty">Belum ada client.</td></tr>{% endfor %}
</tbody></table>
{% endblock %}
