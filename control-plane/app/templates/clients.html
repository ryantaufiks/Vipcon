{% extends "base.html" %}
{% block content %}
<div class="head"><h1>Clients</h1><a class="button primary" href="/clients/new">+ New client</a></div>
<table><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Devices</th><th>Since</th></tr></thead><tbody>
{% for c in clients %}<tr><td><a href="/clients/{{ c.id }}">{{ c.name }}</a></td><td>{{ c.contact_email or '—' }}</td><td>{{ c.contact_phone or '—' }}</td><td>{{ counts.get(c.id, 0) }}</td><td>{{ c.created_at|dt(False) }}</td></tr>
{% else %}<tr><td colspan="5" class="empty">No clients yet.</td></tr>{% endfor %}
</tbody></table>
{% endblock %}
